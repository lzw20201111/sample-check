<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>试件送检清单｜手机版</title>
<meta name="theme-color" content="#17588f">
<meta name="description" content="试件送检清单手机版：现场录入、扫码核验、一键归档。">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/auth.js"></script>
</head>
<body class="m-body">

<div class="m-hero">
  <div class="row">
    <div class="mark" style="background:rgba(255,255,255,.16);box-shadow:none;width:34px;height:34px;border-radius:9px;font-size:14px">试</div>
    <div>
      <h1>试件送检清单【手机版】</h1>
      <div class="sub" id="heroSub">工程项目 · 送检管理</div>
    </div>
    <button class="add" type="button" id="btnAdd">+ 新增</button>
  </div>
</div>

<div class="m-wrap">

  <section class="m-card">
    <div class="m-stats">
      <div class="s"><div class="k">总数</div><div class="v" id="mTotal">0</div></div>
      <div class="s ok"><div class="k">已核实</div><div class="v" id="mDone">0</div></div>
      <div class="s warn"><div class="k">待核实</div><div class="v" id="mPending">0</div></div>
    </div>
  </section>

  <div class="m-tabs" id="tabs">
    <button type="button" data-status="" class="on">全部</button>
    <button type="button" data-status="已核实">已核实</button>
    <button type="button" data-status="待核实">待核实</button>
    <button type="button" class="find" id="findToggle">🔍</button>
  </div>
  <div class="m-find" id="mFind">
    <input class="inp inp-sm" id="mq" placeholder="芯片号 / 检测类型 / 工程 / 部位">
  </div>

  <section class="m-card">
    <div class="m-scanbar">
      <div class="t">📷 扫码核验<span id="scanHint">对准芯片或二维码快速核验</span></div>
      <button class="btn btn-sm btn-pri" type="button" id="btnScan">打开扫码</button>
    </div>
  </section>

  <section class="m-card">
    <div class="panel-h" style="padding:11px 14px">
      <h2 style="font-size:14px" id="listTitle">送检清单</h2>
      <div class="right"><span class="hint" id="listHint">共 0 条</span></div>
    </div>
    <div id="mList"></div>
    <div id="emptyBox"></div>
    <div class="tbl-foot" id="selBar" style="display:none">
      <span id="selInfo"></span>
      <div class="right"><button class="btn btn-sm btn-ghost" type="button" id="btnClearSel">清空</button></div>
    </div>
  </section>

  <div style="text-align:center;font-size:11.5px;color:var(--ink-4);padding:6px 0 2px">
    数据保存在本机浏览器 · <a href="desktop.html">电脑版</a> · <a href="archive.html">归档库</a>
  </div>
</div>

<div class="m-bottom">
  <button type="button" id="btnArcSel"><span class="i">🗄</span>归档选中</button>
  <a class="m-tab-link" href="archive.html"><span class="i">📁</span>归档库</a>
  <button type="button" id="btnImp"><span class="i">📥</span>导入Excel</button>
  <button type="button" id="btnExp"><span class="i">📤</span>导出Excel</button>
</div>

<!-- 新增 / 编辑 -->
<div class="modal" id="formModal">
  <div class="modal-box" style="max-width:520px">
    <div class="modal-h">
      <h3 id="mTitle">新增送检记录</h3>
      <button class="icon-btn x" type="button" data-close="formModal">✕</button>
    </div>
    <div class="modal-b">
      <div class="field" style="margin-bottom:12px"><label for="fExam">检测类型 <span class="req">*</span></label><input class="inp" id="fExam" list="examList" placeholder="如 混凝土抗压"><datalist id="examList"></datalist></div>
      <div class="field" style="margin-bottom:12px"><label for="fProject">工程名称 <span class="req">*</span></label><input class="inp" id="fProject" placeholder="如 滨江花园二期 3# 楼"></div>
      <div class="field" style="margin-bottom:12px"><label for="fPart">部位</label><input class="inp" id="fPart" placeholder="如 四层梁板"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="field"><label for="fGrade">等级</label><input class="inp" id="fGrade" list="gradeList" placeholder="C30"><datalist id="gradeList"></datalist></div>
        <div class="field"><label for="fSpec">规格型号</label><input class="inp" id="fSpec" placeholder="150×150×150mm"></div>
      </div>
      <div class="field" style="margin-bottom:12px"><label for="fCure">养护类型</label><select class="inp" id="fCure"></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="field"><label for="fMade">成型日期</label><input class="inp" type="date" id="fMade"></div>
        <div class="field"><label for="fAge">龄期（天）</label><input class="inp" id="fAge" type="number" min="0" step="1" inputmode="numeric" placeholder="28"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="field"><label for="fTemp">温度（℃）</label><input class="inp" id="fTemp" type="number" step="0.1" inputmode="decimal" placeholder="24.5"></div>
        <div class="field"><label for="fSend">送检日期</label><input class="inp" type="date" id="fSend"></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-4);margin:-6px 0 12px" id="fSendTip">自动 = 成型日期 + 龄期</div>
      <div class="field" style="margin-bottom:12px"><label for="fChip1">芯片号1</label><input class="inp" id="fChip1" placeholder="扫码或手填"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="field"><label for="fChip2">芯片号2</label><input class="inp" id="fChip2" placeholder="可不填"></div>
        <div class="field"><label for="fChip3">芯片号3</label><input class="inp" id="fChip3" placeholder="可不填"></div>
      </div>
      <div class="field"><label for="fRemark">备注</label><input class="inp" id="fRemark" placeholder="可不填"></div>
      <div style="font-size:12px;color:var(--bad);margin-top:10px;min-height:16px" id="formErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn" type="button" data-close="formModal">取消</button>
      <button class="btn btn-pri" type="button" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 扫码 -->
<div class="modal" id="scanModal">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-h">
      <h3>📷 扫码核验</h3>
      <button class="icon-btn x" type="button" data-close="scanModal">✕</button>
    </div>
    <div class="modal-b">
      <div class="scan-stage" style="aspect-ratio:3/4">
        <div class="ph" id="scanPh"><span class="big">📷</span>点击「开始扫码」调用摄像头</div>
        <video id="video" playsinline muted style="display:none"></video>
        <div class="scan-frame" id="scanFrame" style="display:none"></div>
      </div>
      <div class="scan-code" style="margin-top:12px">
        <div class="k">当前识别编号</div>
        <div class="v idle" id="scanCode">—</div>
      </div>
      <div class="manual" style="margin-top:10px">
        <input class="inp inp-sm" id="manualCode" placeholder="也可手动输入芯片号">
        <button class="btn btn-sm" type="button" id="btnFill">填入</button>
      </div>
      <div class="scan-status" id="scanStatus" style="margin-top:8px">摄像头未开启</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-pri" type="button" id="btnStart" style="flex:1">开始扫码</button>
        <button class="btn" type="button" id="btnStop">关闭</button>
        <button class="btn" type="button" id="btnConfirm">确认核验</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn" type="button" id="btnPhoto" style="flex:1">🖼 拍照/选图识别</button>
        <button class="btn" type="button" id="btnTorch" style="display:none">🔦</button>
        <button class="btn btn-pri" type="button" id="btnNewFromScan" style="display:none">➕ 登记为新试件</button>
        <input type="file" id="scanFile" accept="image/*" style="display:none">
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/store.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/scan.js"></script>
<script>
(function () {
  'use strict';
  var Store = window.SampleStore, U = window.UI, $ = U.$, $$ = U.$$;
  var state = { status: '', q: '' };
  var selected = {};
  var editingId = '';
  var scanHandle = null, lastCode = '', torchOn = false;

  function el(id) { return document.getElementById(id); }
  function v(id) { return el(id).value.trim(); }

  Store.CURES.forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c;
    el('fCure').appendChild(o);
  });
  Store.EXAM_TYPES.forEach(function (t) {
    var o = document.createElement('option'); o.value = t; el('examList').appendChild(o);
  });
  Store.GRADES.forEach(function (g) {
    var o = document.createElement('option'); o.value = g; el('gradeList').appendChild(o);
  });
  el('fCure').addEventListener('change', onCureChange);
  el('fMade').addEventListener('input', syncSend);
  el('fAge').addEventListener('input', syncSend);
  el('heroSub').textContent = U.nowText().slice(0, 10) + ' · 现场送检';

  function render() {
    var list = Store.all(state);
    var st = Store.stats();
    el('mTotal').textContent = st.total;
    el('mDone').textContent = st.done;
    el('mPending').textContent = st.pending;
    el('listHint').textContent = '共 ' + list.length + ' 条';
    el('listTitle').textContent = state.status ? state.status + '记录' : '送检清单';

    var box = el('mList');
    box.innerHTML = list.map(function (r) {
      var isSel = !!selected[r.id];
      var badge = r.status === '已核实' ? '<span class="badge ok">已核实</span>' : '<span class="badge warn">待核实</span>';
      var hit = Store.normCode(r.hitChip);
      var chips = [r.chip1, r.chip2, r.chip3].filter(Boolean).map(function (c) {
        var on = hit && Store.normCode(c) === hit;
        return '<span class="m-chip' + (on ? ' chip-hit' : '') + '">' + U.esc(c) + '</span>';
      }).join('');
      var meta = [];
      if (r.age !== '') meta.push('龄期 ' + U.esc(r.age) + 'd');
      if (r.temp !== '') meta.push(U.esc(r.temp) + '℃');
      return '<div class="m-rec" data-id="' + r.id + '">' +
        '<input class="chk rowChk" type="checkbox" ' + (isSel ? 'checked' : '') + ' style="margin-top:3px">' +
        '<div class="l" data-act="edit">' +
          '<div class="t1">' + U.esc(r.examType || '未填检测类型') +
            (r.grade ? '<span class="grade">' + U.esc(r.grade) + '</span>' : '') + badge + '</div>' +
          '<div class="t2">' + U.esc(r.project || '—') + (r.part ? ' · ' + U.esc(r.part) : '') + '</div>' +
          (chips ? '<div class="t3">' + chips + '</div>' : '') +
          '<div class="t3">送检 ' + U.esc(r.sendDate || '—') + ' · 成型 ' + U.esc(r.madeDate || '—') +
            (meta.length ? ' · ' + meta.join(' · ') : '') + '</div>' +
        '</div>' +
        (r.status !== '已核实'
          ? '<button class="btn btn-sm" data-act="confirm" type="button" style="align-self:center">核验</button>'
          : '<button class="icon-btn" data-act="archive" type="button" style="align-self:center" title="归档">⬇</button>') +
      '</div>';
    }).join('');

    el('emptyBox').innerHTML = list.length ? '' :
      '<div class="empty" style="padding:38px 16px"><div class="ico">▤</div><h3>暂无记录</h3>' +
      '<p>' + (Store.all({ archived: false }).length ? '当前筛选下没有记录。' : '点右上角「+ 新增」录入，或从 Excel 导入。') + '</p>' +
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn btn-sm" type="button" id="btnSeed">载入演示数据</button>' +
      '<button class="btn btn-sm btn-pri" type="button" id="btnAdd2">+ 新增记录</button></div></div>';
    if (el('btnSeed')) el('btnSeed').onclick = function () {
      var n = Store.seed(); U.toast(n ? '已载入 ' + n + ' 条演示数据' : '已有数据', 'ok'); render();
    };
    if (el('btnAdd2')) el('btnAdd2').onclick = function () { openAdd(); };

    bind();
    updateSel();
  }

  function bind() {
    $$('#mList .m-rec').forEach(function (row) {
      var id = row.getAttribute('data-id');
      row.querySelector('.rowChk').addEventListener('change', function (e) {
        if (e.target.checked) selected[id] = true; else delete selected[id];
        updateSel();
      });
      $$('[data-act]', row).forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          var act = b.getAttribute('data-act');
          if (act === 'edit') openEdit(id);
          else if (act === 'confirm') {
            var rr = Store.get(id);
            var chip = rr ? (rr.chip1 || rr.chip2 || rr.chip3 || '') : '';
            var res = Store.confirm(id, chip);
            if (res) { Store.logScan(chip, true, res.id); U.toast('已核实：' + desc(res), 'ok'); render(); }
          } else if (act === 'archive') {
            var rec = Store.get(id);
            if (confirm('把 ' + desc(rec) + ' 移入归档库？')) { Store.archive([id]); delete selected[id]; U.toast('已归档', 'ok'); render(); }
          }
        });
      });
    });
  }

  function updateSel() {
    var n = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
    el('selBar').style.display = n ? 'flex' : 'none';
    el('selInfo').innerHTML = '<span class="sel-info">已选 ' + n + ' 条</span>';
  }

  /* 表单 */
  function desc(r) {
    if (!r) return '该记录';
    var s = [r.examType, r.grade, r.part].filter(Boolean).join(' · ');
    return s || r.project || '该记录';
  }

  /* 送检日期 = 成型日期 + 龄期（标准养护 / 同条件养护） */
  function syncSend() {
    var auto = Store.isAutoSend(el('fCure').value);
    var send = el('fSend');
    send.readOnly = auto;
    send.classList.toggle('ro', auto);
    if (auto) {
      var d = Store.addDays(v('fMade'), v('fAge'));
      if (d) send.value = d;
    }
    el('fSendTip').textContent = auto ? '自动 = 成型日期 + 龄期' : '该养护类型可手动填写';
  }
  function onCureChange() {
    if (Store.isAutoSend(el('fCure').value) && !v('fAge')) el('fAge').value = '28';
    syncSend();
  }

  function openAdd(prefillChip) {
    if (typeof prefillChip !== 'string') prefillChip = '';
    editingId = '';
    el('mTitle').textContent = '新增送检记录';
    ['fExam', 'fProject', 'fPart', 'fGrade', 'fSpec', 'fMade', 'fAge', 'fTemp', 'fSend',
      'fChip1', 'fChip2', 'fChip3', 'fRemark'].forEach(function (id) { el(id).value = ''; });
    el('fCure').value = '标准养护';
    el('fMade').value = Store.today();
    el('fAge').value = '28';
    syncSend();
    if (prefillChip) el('fChip1').value = prefillChip;
    el('formErr').textContent = '';
    el('formModal').classList.add('show');
  }
  function openEdit(id) {
    var r = Store.get(id); if (!r) return;
    editingId = r.id;
    el('mTitle').textContent = '编辑送检记录';
    el('fExam').value = r.examType; el('fProject').value = r.project;
    el('fPart').value = r.part; el('fGrade').value = r.grade; el('fSpec').value = r.spec;
    el('fCure').value = r.cure || '标准养护';
    el('fMade').value = r.madeDate; el('fAge').value = r.age; el('fTemp').value = r.temp;
    el('fSend').value = r.sendDate;
    el('fChip1').value = r.chip1; el('fChip2').value = r.chip2; el('fChip3').value = r.chip3;
    el('fRemark').value = r.remark;
    syncSend();
    el('formErr').textContent = '';
    el('formModal').classList.add('show');
  }
  function saveForm() {
    if (!v('fExam') || !v('fProject')) {
      el('formErr').textContent = '请填写检测类型和工程名称';
      if (!v('fExam')) el('fExam').classList.add('err');
      if (!v('fProject')) el('fProject').classList.add('err');
      return;
    }
    var chips = [v('fChip1'), v('fChip2'), v('fChip3')].map(Store.normCode).filter(Boolean);
    var msg = '';
    chips.forEach(function (c) {
      var o = Store.chipOwner(c, editingId);
      if (o && !msg) msg = c + ' 已绑定到 ' + desc(o);
    });
    if (msg && !confirm(msg + '\n\n仍要保存？')) return;
    var sendDate = Store.isAutoSend(el('fCure').value)
      ? (Store.addDays(v('fMade'), v('fAge')) || v('fSend'))
      : v('fSend');
    var rec = {
      id: editingId,
      examType: v('fExam'), project: v('fProject'), part: v('fPart'), grade: v('fGrade'),
      spec: v('fSpec'), cure: el('fCure').value,
      madeDate: v('fMade'), age: v('fAge'), temp: v('fTemp'), sendDate: sendDate,
      chip1: v('fChip1'), chip2: v('fChip2'), chip3: v('fChip3'), remark: v('fRemark')
    };
    if (editingId) {
      var old = Store.get(editingId);
      rec.status = old ? old.status : '待核实';
      rec.confirmedAt = old ? old.confirmedAt : '';
      rec.hitChip = old && old.hitChip && chips.indexOf(Store.normCode(old.hitChip)) >= 0 ? old.hitChip : '';
    }
    if (!Store.save(rec)) { el('formErr').textContent = '保存失败'; return; }
    el('formModal').classList.remove('show');
    U.toast(editingId ? '已保存修改' : '已新增 1 条', 'ok');
    render();
  }

  /* 扫码 */
  function setCode(c) {
    lastCode = c || '';
    var n = el('scanCode');
    n.textContent = c || '—';
    n.className = 'v' + (c ? '' : ' idle');
    if (!c) el('btnNewFromScan').style.display = 'none';
  }
  var FIELD_CN = { chip1: '芯片号1', chip2: '芯片号2', chip3: '芯片号3' };
  /* 命中芯片号 → 卡片刻标色 + 状态置为「已核实」 */
  function applyScan(raw) {
    var hit = Store.findChip(raw);
    el('btnNewFromScan').style.display = 'none';
    if (!hit) {
      el('btnNewFromScan').textContent = '➕ 登记 ' + raw;
      el('btnNewFromScan').style.display = '';
      setStatus('识别到 ' + raw + '，芯片号1/2/3 都没匹配 —— 点「登记为新试件」存入数据库', 'err');
      return null;
    }
    var wasDone = hit.rec.status === '已核实' && Store.normCode(hit.rec.hitChip) === Store.normCode(hit.chip);
    var res = Store.confirm(hit.rec.id, hit.chip);
    Store.logScan(hit.chip, true, res.id);
    render();
    var where = FIELD_CN[hit.field] || '芯片号';
    setStatus('已核实：命中 ' + where + '「' + hit.chip + '」· ' + (res.examType || '') +
      (res.part ? ' / ' + res.part : '') + (wasDone ? '（此前已核实）' : ''), 'ok');
    if (!wasDone) U.toast('已核实：' + where + ' ' + hit.chip, 'ok');
    var node = document.querySelector('#mList .m-rec[data-id="' + res.id + '"]');
    if (node && node.scrollIntoView) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return res;
  }
  /* 识别成功后的处理：命中即核验，未登记给「登记为新试件」入口 */
  function afterCode(code) {
    applyScan(code);
  }
  function setStatus(m, cls) {
    var n = el('scanStatus');
    n.textContent = m; n.className = 'scan-status' + (cls ? ' ' + cls : '');
  }
  function startScan() {
    if (scanHandle) { scanHandle.stop(); scanHandle = null; }
    el('video').style.display = 'block';
    el('scanPh').style.display = 'none';
    el('scanFrame').style.display = 'block';
    el('btnTorch').style.display = 'none';
    torchOn = false;
    setStatus('正在启动摄像头…');
    scanHandle = Scanner.start(el('video'), function (code) {
      setCode(code);
      afterCode(code);
    }, function (s) {
      if (s === 'running') { setStatus('摄像头已开启，对准芯片', 'ok'); el('btnTorch').style.display = ''; }
      else if (s === 'denied') setStatus('摄像头权限被拒绝，请允许后重试，或手动输入', 'err');
      else if (s === 'nocamera') setStatus('没有可用摄像头，请手动输入编号', 'err');
      else if (s === 'unsupported') setStatus('当前浏览器不支持调用摄像头，请手动输入', 'err');
      else if (s === 'fallback-manual') setStatus('扫码组件加载失败（需联网），请手动输入', 'err');
    });
  }
  /* 照片识别：现场对试块拍照更稳，支持闪光补光后拍摄 */
  function doPhotoScan() {
    el('scanFile').value = '';
    el('scanFile').click();
  }
  function onScanFile(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    setStatus('正在识别照片…');
    Scanner.decodeFile(f).then(function (code) {
      if (!code) { setStatus('照片里没识别出二维码，靠近一点重拍，或手动输入编号', 'err'); U.toast('未识别出条码', 'err'); return; }
      setCode(code);
      afterCode(code);
      U.toast('已识别：' + code, 'ok');
    }).catch(function (err) { setStatus(err.message || '照片识别失败', 'err'); });
  }
  function stopScan() {
    if (scanHandle) { scanHandle.stop(); scanHandle = null; }
    el('video').style.display = 'none';
    el('scanPh').style.display = 'block';
    el('scanFrame').style.display = 'none';
    setStatus('摄像头已关闭');
  }
  function doConfirm() {
    var code = v('manualCode') || lastCode;
    if (!code) { U.toast('请先扫码或输入芯片号', 'err'); return; }
    var res = applyScan(code);
    if (!res) {
      Store.logScan(code, false, '');
      U.toast('芯片号1/2/3 都没有匹配记录', 'err');
      return;
    }
    setCode(''); el('manualCode').value = '';
    lastCode = '';
  }

  /* 事件 */
  el('btnAdd').onclick = function () { openAdd(); };
  el('btnSave').onclick = saveForm;
  el('btnScan').onclick = function () {
    el('scanModal').classList.add('show');
    setCode(''); setStatus('点击「开始扫码」调用摄像头');
  };
  el('btnStart').onclick = startScan;
  el('btnStop').onclick = stopScan;
  el('btnConfirm').onclick = doConfirm;
  el('btnFill').onclick = function () {
    if (!v('manualCode')) { U.toast('请输入芯片号', 'err'); return; }
    setCode(Store.normCode(v('manualCode')));
    doConfirm();
  };
  el('btnPhoto').onclick = doPhotoScan;
  el('scanFile').addEventListener('change', onScanFile);
  el('btnNewFromScan').onclick = function () {
    var code = lastCode || v('manualCode');
    if (!code) return;
    el('scanModal').classList.remove('show');
    stopScan();
    openAdd(code);
  };
  el('btnTorch').onclick = function () {
    if (!scanHandle || !scanHandle.torch) return;
    torchOn = !torchOn;
    scanHandle.torch(torchOn).then(function (ok) {
      if (!ok) { U.toast('该设备不支持手电筒', 'err'); torchOn = false; }
      el('btnTorch').style.background = torchOn ? '#ffd66b' : '';
    });
  };
  el('manualCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') doConfirm(); });

  $$('#tabs [data-status]').forEach(function (b) {
    b.onclick = function () {
      $$('#tabs [data-status]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      state.status = b.getAttribute('data-status');
      render();
    };
  });
  el('findToggle').onclick = function () { el('mFind').classList.toggle('show'); if (el('mFind').classList.contains('show')) el('mq').focus(); };
  var qt = null;
  el('mq').addEventListener('input', function () {
    clearTimeout(qt);
    qt = setTimeout(function () { state.q = el('mq').value; render(); }, 180);
  });

  el('btnArcSel').onclick = function () {
    var ids = Object.keys(selected).filter(function (k) { return selected[k]; });
    if (!ids.length) { U.toast('请先勾选记录', 'err'); return; }
    if (!confirm('归档选中的 ' + ids.length + ' 条？')) return;
    var n = Store.archive(ids); selected = {};
    U.toast('已归档 ' + n + ' 条', 'ok'); render();
  };
  el('btnClearSel').onclick = function () { selected = {}; render(); };
  el('btnImp').onclick = function () {
    U.pickFile('.csv,.xlsx,.xls', function (f) {
      U.readRows(f).then(function (rows) {
        var res = Store.importRows(rows);
        U.toast(res.msg, res.ok ? 'ok' : 'err');
        if (res.ok) render();
      }).catch(function (e) { U.toast(e.message || '导入失败', 'err'); });
    });
  };
  el('btnExp').onclick = function () {
    var list = Store.all(state);
    if (!list.length) { U.toast('没有可导出的记录', 'err'); return; }
    U.exportExcel(list, '试件送检清单_' + Store.today() + '.xls', '试件送检清单（' + Store.today() + '）');
    U.toast('已导出 ' + list.length + ' 条', 'ok');
  };

  $$('[data-close]').forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-close');
      el(id).classList.remove('show');
      if (id === 'scanModal') stopScan();
    };
  });
  ['formModal', 'scanModal'].forEach(function (mid) {
    el(mid).addEventListener('click', function (e) {
      if (e.target === el(mid)) { el(mid).classList.remove('show'); if (mid === 'scanModal') stopScan(); }
    });
  });

  render();

  /* 云端同步：从飞书拉到数据后自动重绘 */
  document.addEventListener('cloud:updated', function () { render(); });
  if (window.SampleCloud) window.SampleCloud.start({ onUpdate: render });
})();
</script>
</body>
</html>
