<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>试件送检清单 · 入口</title>
<meta name="description" content="试件送检清单：电脑版、手机版、归档库三个页面，免费在线使用。">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/auth.js"></script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 26px 16px; }
  .entry { width: 100%; max-width: 820px; }
  .hd { text-align: center; margin-bottom: 24px; }
  .hd .mark { width: 54px; height: 54px; border-radius: 14px; margin: 0 auto 14px; font-size: 22px; }
  .hd h1 { font-size: 22px; letter-spacing: -.3px; }
  .hd p { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ec { display: block; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; box-shadow: var(--sh); transition: .18s; color: var(--ink); }
  .ec:hover { transform: translateY(-3px); border-color: #b9d3e9; box-shadow: 0 22px 36px -24px rgba(15, 27, 45, .45); }
  .ec .i { font-size: 24px; }
  .ec h3 { font-size: 15px; margin: 10px 0 5px; }
  .ec p { font-size: 12.5px; color: var(--ink-3); line-height: 1.55; }
  .foot { text-align: center; font-size: 12px; color: var(--ink-4); margin-top: 20px; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } .hd h1 { font-size: 19px; } }
</style>
</head>
<body>
<div class="entry">
  <div class="hd">
    <div class="mark">试</div>
    <h1>试件送检清单</h1>
    <p>工程项目 · 送检管理 —— 录入、扫码核验、归档一体化</p>
  </div>

  <div class="cards">
    <a class="ec" href="desktop.html">
      <div class="i">🖥</div>
      <h3>电脑版</h3>
      <p>侧栏工作台 + 统计卡 + 台账表格，批量导入导出、勾选归档。</p>
    </a>
    <a class="ec" href="mobile.html">
      <div class="i">📱</div>
      <h3>手机版</h3>
      <p>现场单手录入，状态标签切换、底部归档/导入/导出。</p>
    </a>
    <a class="ec" href="archive.html">
      <div class="i">🗂</div>
      <h3>归档库</h3>
      <p>已归档试件集中查看，可撤回主清单、导出 Excel / CSV。</p>
    </a>
  </div>

  <div class="foot" id="foot">正在为你打开适配的版本…　<a href="#" id="stop">留在此页</a></div>
</div>

<script src="assets/ui.js"></script>
<script>
(function () {
  var mobile = UI.isMobile ? UI.isMobile() : (window.innerWidth < 760);
  var target = mobile ? 'mobile.html' : 'desktop.html';
  var stop = false;
  document.getElementById('foot').innerHTML =
    '即将进入 <b>' + (mobile ? '手机版' : '电脑版') + '</b>…　<a href="#" id="stop">留在此页</a>';
  document.getElementById('stop').onclick = function (e) {
    e.preventDefault(); stop = true;
    document.getElementById('foot').innerHTML = '已留在入口页，点击上面的卡片进入对应版本。';
  };
  setTimeout(function () { if (!stop) location.replace(target); }, 1000);
})();
</script>
</body>
</html>
