<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>试件送检清单｜电脑版</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
  }

  body {
    background: #f4f6f8;
    color: #1f2329;
    height: 100vh;
    overflow: hidden;
  }

  /* 顶部栏 */
  .topbar {
    height: 56px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar .logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    margin-right: 10px;
  }

  .topbar .title {
    font-size: 16px;
    font-weight: 600;
  }

  .topbar .breadcrumb {
    margin-left: 16px;
    color: #8a8f99;
    font-size: 13px;
  }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-right button {
    border: 1px solid #d0d5dd;
    background: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #1f2329;
    white-space: nowrap;
  }

  .topbar-right button:hover {
    background: #f7f8fa;
  }

  .topbar-right .primary {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  .topbar-right .warn {
    background: #f97316;
    color: #fff;
    border-color: #f97316;
  }
  .topbar-right .primary:hover {
    background: #1d4ed8;
  }

  /* 主体布局 PC三栏 */
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr 340px;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 56px);
  }

  /* 左侧目录 */
  .sidebar {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
    overflow-y: auto;
  }

  .sidebar h4 {
    font-size: 13px;
    color: #8a8f99;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .sidebar ul {
    list-style: none;
  }

  .sidebar li {
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: #4e5969;
    cursor: pointer;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar li:hover {
    background: #f2f5f8;
  }

  .sidebar li.active {
    background: #eaf3ff;
    color: #2563eb;
    font-weight: 600;
  }

  .sidebar li .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2563eb;
  }

  .stat-card {
    margin-top: 16px;
    padding: 12px;
    background: #f7fafc;
    border-radius: 8px;
    border: 1px solid #eef0f3;
  }

  .stat-card p {
    font-size: 12px;
    color: #8a8f99;
    margin-bottom: 6px;
  }

  .stat-card .num {
    font-size: 22px;
    font-weight: 700;
    color: #1f2329;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-item .label {
    font-size: 12px;
    color: #8a8f99;
  }

  .stat-item .value {
    font-size: 16px;
    font-weight: 600;
  }

  .green { color: #16a34a; }
  .orange { color: #f59e0b; }
  .blue { color: #2563eb; }

  /* 中间表格区 */
  .main {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    padding: 14px 16px;
    border-bottom: 1px solid #eef0f3;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    min-width:140px;
  }

  .search-input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
  }

  .filter-select {
    padding: 8px 10px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }

  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    background: #f2f5f8;
    color: #1f2329;
    border: 1px solid #d0d5dd;
    white-space: nowrap;
  }

  .btn:hover {
    background: #eef2f6;
  }

  .btn-primary {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }

  .btn-primary:hover {
    background: #1d4ed8;
  }

  .btn-success {
    background: #16a34a;
    color: #fff;
    border-color: #16a34a;
  }
  .btn-warn {
    background: #f97316;
    color: #fff;
    border-color: #f97316;
  }
  .btn-success:hover {
    background: #15803d;
  }

  .table-wrap {
    flex: 1;
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    position: sticky;
    top: 0;
    background: #f7fafc;
    color: #4e5969;
    font-weight: 600;
    text-align: left;
    padding: 10px 10px;
    border-bottom: 1px solid #eef0f3;
    white-space: nowrap;
  }

  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid #f2f4f7;
    color: #1f2329;
    white-space: nowrap;
  }

  tbody tr:hover {
    background: #f7fafc;
  }

  tbody tr.row-checked {
    background: #eef7ff;
  }

  tbody tr.row-checked:hover {
    background: #e3f2ff;
  }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }

  .tag-green {
    background: #e6f7ee;
    color: #16a34a;
  }

  .tag-gray {
    background: #f2f4f7;
    color: #4e5969;
  }

  .tag-orange {
    background: #fff7e6;
    color: #f59e0b;
  }

  .checkbox {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #2563eb;
  }

  .link-btn {
    background: none;
    border: none;
    color: #2563eb;
    cursor: pointer;
    font-size: 13px;
  }

  .link-btn.danger {
    color: #dc2626;
  }

  /* 右侧扫码面板 */
  .right-panel {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
    overflow-y: auto;
  }

  .right-panel h4 {
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .scan-box {
    position: relative;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
  }

  .scan-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .scan-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #8a8f99;
    gap: 10px;
  }

  .scan-frame {
    position: absolute;
    inset: 14px;
    border: 2px solid rgba(37, 99, 235, 0.7);
    border-radius: 8px;
    pointer-events: none;
    display: none;
  }

  .scan-frame::before,
  .scan-frame::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: #fff;
    border-style: solid;
  }

  .scan-frame::before {
    top: -2px;
    left: -2px;
    border-width: 3px 0 0 3px;
  }

  .scan-frame::after {
    bottom: -2px;
    right: -2px;
    border-width: 0 3px 3px 0;
  }

  .scan-result {
    margin-top: 12px;
    padding: 12px;
    background: #f7fafc;
    border: 1px solid #eef0f3;
    border-radius: 8px;
  }

  .scan-result p {
    font-size: 12px;
    color: #8a8f99;
    margin-bottom: 4px;
  }

  .scan-result .code {
    font-size: 16px;
    font-weight: 700;
    color: #1f2329;
  }

  .scan-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .canvas {
    display: none;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(31, 35, 41, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-mask.show {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: 10px;
    width: 560px;
    max-width: 90%;
    padding: 20px;
  }

  .modal h3 {
    margin-bottom: 14px;
    font-size: 16px;
  }

  .modal label {
    display: block;
    font-size: 13px;
    color: #4e5969;
    margin: 10px 0 4px;
  }

  .modal input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }

  .modal input:focus {
    border-color: #2563eb;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  @media (max-width:1400px){
    .layout{
      grid-template-columns:220px 1fr 300px;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"></div>
  <div class="title">试件送检清单【电脑版】</div>
  <div class="breadcrumb">/ 工程项目 / 送检管理</div>
  <div class="topbar-right">
    <button onclick="document.getElementById('fileInput').click()">📥 导入Excel</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event)" />
    <button onclick="exportExcel()">导出Excel</button>
    <button onclick="exportCSV()">导出CSV</button>
    <button class="warn" onclick="archiveSelected()">归档选中</button>
    <button onclick="window.open('archive.html','_blank')">打开归档库</button>
    <button class="primary" onclick="openAddModal()">+ 新增记录</button>
  </div>
</div>

<div class="layout">
  <!-- 左侧目录 -->
  <aside class="sidebar">
    <h4>工作台</h4>
    <ul>
      <li class="active"><span class="dot"></span>送检清单</li>
      <li>📷 今日扫码</li>
      <li>✅ 已确认记录</li>
      <li>📊 数据导出</li>
    </ul>

    <div class="stat-card">
      <p>今日送检总数</p>
      <div class="num" id="totalNum">0</div>
      <div class="stat-row">
        <div class="stat-item">
          <div class="value green" id="checkedNum">0</div>
          <div class="label">已确认</div>
        </div>
        <div class="stat-item">
          <div class="value orange" id="waitNum">0</div>
          <div class="label">待核验</div>
        </div>
        <div class="stat-item">
          <div class="value blue" id="scanNum">0</div>
          <div class="label">今日扫码</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 中间表格 -->
  <main class="main">
    <div class="toolbar">
      <input id="keyword" class="search-input" placeholder="输入试件编号搜索" />
      <select id="filterStatus" class="filter-select">
        <option value="all">全部状态</option>
        <option value="checked">已确认</option>
        <option value="wait">待核验</option>
      </select>
      <button class="btn" onclick="searchData()">🔍 查找</button>
      <button class="btn btn-success" onclick="openScan()">📷 扫码核验</button>
      <button class="btn" onclick="openAddModal()">+ 新增</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="checkAll" class="checkbox" onchange="toggleAllCheck()"></th>
            <th>序号</th>
            <th>试件编号</th>
            <th>工程名称</th>
            <th>规格型号</th>
            <th>养护类型</th>
            <th>成型日期</th>
            <th>送检日期</th>
            <th>芯片号1</th>
            <th>芯片号2</th>
            <th>芯片号3</th>
            <th>状态</th>
            <th style="width:80px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- 右侧扫码 -->
  <section class="right-panel">
    <h4>📷 扫码登记</h4>

    <div class="scan-box">
      <video id="video" autoplay playsinline style="display:none;"></video>
      <div class="scan-placeholder" id="scanPlaceholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        <span>点击“开始扫码”调用摄像头</span>
      </div>
      <div class="scan-frame" id="scanFrame"></div>
    </div>

    <div class="scan-result">
      <p>当前识别编号</p>
      <div class="code" id="scanCode">—</div>
    </div>

    <div class="scan-actions">
      <button class="btn btn-primary" id="scanBtn" onclick="openScan()">开始扫码</button>
      <button class="btn" id="stopBtn" onclick="closeScan()" style="display:none;">关闭摄像头</button>
      <button class="btn btn-success" onclick="confirmScan()">确认核验</button>
    </div>
  </section>
</div>

<canvas id="canvas" class="canvas"></canvas>

<!-- 新增记录弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <h3>新增送检记录</h3>
    <label>试件编号</label>
    <input id="fCode" placeholder="请输入二维码中的数字编号" />
    <label>工程名称</label>
    <input id="fProject" placeholder="如：水岸花园一期" />
    <label>规格型号</label>
    <input id="fSpec" placeholder="如：C30 150×150×150" />
    <label>养护类型</label>
    <input id="fCureType" placeholder="如：标养 / 同养" />
    <label>成型日期</label>
    <input id="fFormDate" type="date" />
    <label>送检日期</label>
    <input id="fSendDate" type="date" />
    <label>芯片号1</label>
    <input id="fChip1" placeholder="芯片编号" />
    <label>芯片号2</label>
    <input id="fChip2" placeholder="芯片编号" />
    <label>芯片号3</label>
    <input id="fChip3" placeholder="芯片编号" />

    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="addRow()">保存</button>
    </div>
  </div>
</div>

<script>
  let dataList = JSON.parse(localStorage.getItem("sampleCheckList")) || [];
  let archiveList = JSON.parse(localStorage.getItem("sampleArchiveList")) || [];
  let scanStream = null;
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  function saveData() {
    localStorage.setItem("sampleCheckList", JSON.stringify(dataList));
  }
  function saveArchive(){
    localStorage.setItem("sampleArchiveList", JSON.stringify(archiveList));
  }

  //全选
  function toggleAllCheck(){
    const allCb = document.getElementById("checkAll");
    const items = document.querySelectorAll(".row-checkbox");
    items.forEach(cb=> cb.checked = allCb.checked);
  }

  function renderTable() {
    const keyword = document.getElementById("keyword").value.trim().toLowerCase();
    const filter = document.getElementById("filterStatus").value;
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    const filtered = dataList
      .map((item, idx) => ({ item, idx }))
      .filter(({ item }) => {
        if (filter === "checked" && !item.checked) return false;
        if (filter === "wait" && item.checked) return false;
        if (keyword && !item.code.toLowerCase().includes(keyword)) return false;
        return true;
      });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="13" style="text-align:center;color:#8a8f99;padding:30px;">暂无数据</td></tr>`;
    }

    filtered.forEach(({ item, idx }) => {
      const tr = document.createElement("tr");
      if (item.checked) tr.classList.add("row-checked");

      tr.innerHTML = `
        <td><input type="checkbox" class="checkbox row-checkbox" data-idx="${idx}"></td>
        <td>${idx + 1}</td>
        <td><strong>${item.code || ""}</strong></td>
        <td>${item.project || ""}</td>
        <td>${item.spec || ""}</td>
        <td>${item.cureType || ""}</td>
        <td>${item.formDate || ""}</td>
        <td>${item.sendDate || ""}</td>
        <td>${item.chip1 || ""}</td>
        <td>${item.chip2 || ""}</td>
        <td>${item.chip3 || ""}</td>
        <td>${item.checked ? '<span class="tag tag-green">已确认</span>' : '<span class="tag tag-orange">待核验</span>'}</td>
        <td><button class="link-btn danger" onclick="deleteRow(${idx})">删除</button></td>
      `;
      tbody.appendChild(tr);
    });

    renderStats();
  }

  function renderStats() {
    document.getElementById("totalNum").textContent = dataList.length;
    document.getElementById("checkedNum").textContent = dataList.filter(i => i.checked).length;
    document.getElementById("waitNum").textContent = dataList.filter(i => !i.checked).length;
    document.getElementById("scanNum").textContent = localStorage.getItem("scanCount") || 0;
  }

  //归档选中记录
  function archiveSelected(){
    const selected = [];
    document.querySelectorAll(".row-checkbox:checked").forEach(cb=>{
      const idx = Number(cb.dataset.idx);
      selected.push(idx);
    })
    if(selected.length===0){
      alert("请勾选需要归档的记录");
      return;
    }
    //倒序取出，防止下标错乱
    selected.sort((a,b)=>b-a).forEach(idx=>{
      archiveList.push(dataList[idx]);
      dataList.splice(idx,1);
    })
    saveData();
    saveArchive();
    renderTable();
    alert(`成功归档 ${selected.length} 条记录，可打开归档库查看`);
  }

  function openAddModal() {
    document.getElementById("addModal").classList.add("show");
    const today = new Date().toISOString().slice(0, 10);
    if (!document.getElementById("fFormDate").value) {
      document.getElementById("fFormDate").value = today;
    }
    if (!document.getElementById("fSendDate").value) {
      document.getElementById("fSendDate").value = today;
    }
  }

  function closeAddModal() {
    document.getElementById("addModal").classList.remove("show");
  }

  function addRow() {
    const code = document.getElementById("fCode").value.trim();
    const project = document.getElementById("fProject").value.trim();
    const spec = document.getElementById("fSpec").value.trim();
    const cureType = document.getElementById("fCureType").value.trim();
    const formDate = document.getElementById("fFormDate").value;
    const sendDate = document.getElementById("fSendDate").value;
    const chip1 = document.getElementById("fChip1").value.trim();
    const chip2 = document.getElementById("fChip2").value.trim();
    const chip3 = document.getElementById("fChip3").value.trim();

    if (!code) {
      alert("请填写试件编号");
      return;
    }

    if (dataList.some(i => i.code === code)) {
      alert("该试件编号已存在");
      return;
    }

    dataList.push({
      code,
      project,
      spec,
      cureType,
      formDate,
      sendDate,
      chip1,
      chip2,
      chip3,
      checked: false
    });

    saveData();
    renderTable();
    closeAddModal();

    document.getElementById("fCode").value = "";
    document.getElementById("fProject").value = "";
    document.getElementById("fSpec").value = "";
    document.getElementById("fCureType").value = "";
    document.getElementById("fFormDate").value = "";
    document.getElementById("fSendDate").value = "";
    document.getElementById("fChip1").value = "";
    document.getElementById("fChip2").value = "";
    document.getElementById("fChip3").value = "";
  }

  function toggleCheck(idx) {
    dataList[idx].checked = !dataList[idx].checked;
    saveData();
    renderTable();
  }

  function deleteRow(idx) {
    if (!confirm("确定删除这条记录？")) return;
    dataList.splice(idx, 1);
    saveData();
    renderTable();
  }

  function searchData() {
    renderTable();
  }

  function openScan() {
    document.getElementById("scanPlaceholder").style.display = "none";
    video.style.display = "block";
    document.getElementById("scanFrame").style.display = "block";
    document.getElementById("scanBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "inline-block";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        scanStream = stream;
        video.srcObject = stream;
        scanLoop();
      })
      .catch(() => {
        alert("无法调用摄像头，请使用 HTTPS 环境打开网页。");
        closeScan();
      });
  }

  function closeScan() {
    if (scanStream) {
      scanStream.getTracks().forEach(track => track.stop());
      scanStream = null;
    }
    video.style.display = "none";
    document.getElementById("scanPlaceholder").style.display = "flex";
    document.getElementById("scanFrame").style.display = "none";
    document.getElementById("scanBtn").style.display = "inline-block";
    document.getElementById("stopBtn").style.display = "none";
  }

  function scanLoop() {
    if (!scanStream) return;

    canvas.width = video.videoWidth || 480;
    canvas.height = video.videoHeight || 640;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(imgData.data, canvas.width, canvas.height);

    if (qr) {
      document.getElementById("scanCode").textContent = qr.data;
      document.getElementById("keyword").value = qr.data;

      let count = parseInt(localStorage.getItem("scanCount") || "0", 10);
      localStorage.setItem("scanCount", count + 1);

      closeScan();
      return;
    }

    requestAnimationFrame(scanLoop);
  }

  function confirmScan() {
    const code = document.getElementById("scanCode").textContent;
    if (!code || code === "—") {
      alert("请先扫码获取编号");
      return;
    }

    const idx = dataList.findIndex(i => i.code === code);
    if (idx === -1) {
      alert("未找到该编号对应的送检记录");
      return;
    }

    dataList[idx].checked = true;
    saveData();
    renderTable();
    alert(`已确认：${code}`);
  }

  function exportCSV() {
    if (dataList.length === 0) {
      alert("暂无数据可导出");
      return;
    }

    let text = "序号,试件编号,工程名称,规格型号,养护类型,成型日期,送检日期,芯片号1,芯片号2,芯片号3,核验状态\n";
    dataList.forEach((item, i) => {
      text += `${i + 1},${item.code||""},${item.project||""},${item.spec||""},${item.cureType||""},${item.formDate||""},${item.sendDate||""},${item.chip1||""},${item.chip2||""},${item.chip3||""},${item.checked ? "已确认" : "待核验"}\n`;
    });

    const blob = new Blob(["\uFEFF" + text], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "试件送检清单.csv";
    a.click();
  }

  // 导出Excel(.xlsx)文件
  function exportExcel() {
    if (dataList.length === 0) {
      alert("暂无数据可导出");
      return;
    }
    const rows = dataList.map((item, i) => ({
      "序号": i + 1,
      "试件编号": item.code || "",
      "工程名称": item.project || "",
      "规格型号": item.spec || "",
      "养护类型": item.cureType || "",
      "成型日期": item.formDate || "",
      "送检日期": item.sendDate || "",
      "芯片号1": item.chip1 || "",
      "芯片号2": item.chip2 || "",
      "芯片号3": item.chip3 || "",
      "核验状态": item.checked ? "已确认" : "待核验"
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "送检清单");
    XLSX.writeFile(wb, "试件送检清单.xlsx");
  }

  // 从Excel/CSV文件导入数据
  function importExcel(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (rows.length === 0) {
          alert("文件中没有数据");
          return;
        }
        let added = 0, skipped = 0;
        rows.forEach(row => {
          const code = String(row["试件编号"] || row["编号"] || row["code"] || "").trim();
          if (!code) return;
          if (dataList.some(i => i.code === code)) {
            skipped++;
            return;
          }
          dataList.push({
            code: code,
            project: String(row["工程名称"] || row["工程"] || row["project"] || "").trim(),
            spec: String(row["规格型号"] || row["规格"] || row["spec"] || "").trim(),
            cureType: String(row["养护类型"] || row["养护"] || row["cureType"] || "").trim(),
            formDate: String(row["成型日期"] || row["formDate"] || "").trim(),
            sendDate: String(row["送检日期"] || row["sendDate"] || "").trim(),
            chip1: String(row["芯片号1"] || row["芯片1"] || row["chip1"] || "").trim(),
            chip2: String(row["芯片号2"] || row["芯片2"] || row["chip2"] || "").trim(),
            chip3: String(row["芯片号3"] || row["芯片3"] || row["chip3"] || "").trim(),
            checked: false
          });
          added++;
        });
        saveData();
        renderTable();
        alert(`导入完成：新增 ${added} 条，跳过重复/空编号 ${skipped} 条`);
      } catch (err) {
        alert("导入失败，请确认文件格式。表头需包含：试件编号、工程名称、规格型号、养护类型、成型日期、送检日期、芯片号1、芯片号2、芯片号3");
      }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = "";
  }

  document.getElementById("keyword").addEventListener("input", renderTable);
  document.getElementById("filterStatus").addEventListener("change", renderTable);

  renderTable();
</script>

</body>
